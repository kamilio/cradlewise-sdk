name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ["20.12.2", "22.22.0", "24.14.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm audit signatures --omit=optional
      - run: npm run release:check
      - run: npm run check

  homey-runtime:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/homey-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run homey:vendor
      - name: Verify committed Homey vendor is current
        run: git diff --exit-code -- packages/homey-app/package-lock.json packages/homey-app/vendor
      - run: npm ci --ignore-scripts --prefix packages/homey-app
      - run: npm run build --prefix packages/homey-app
      - run: npm audit --prefix packages/homey-app
      - run: npm audit --prefix packages/homey-app --omit=dev
      - run: npm audit signatures --omit=optional
        working-directory: packages/homey-app
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/homey-app/package-lock.json
      - run: npm run typecheck --prefix packages/homey-app
      - run: npm test --prefix packages/homey-app
      - run: npm run smoke:build --prefix packages/homey-app

  homey-build:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/homey-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run homey:verify
      - name: Verify committed Homey vendor is current
        run: git diff --exit-code -- packages/homey-app/package-lock.json packages/homey-app/vendor
      - run: node packages/homey-app/scripts/prepare-homey-stage.mjs "$RUNNER_TEMP/cradlewise-homey-stage"
      - run: node packages/homey-app/scripts/verify-prepared-homey-stage.mjs "$RUNNER_TEMP/cradlewise-homey-stage"
      - run: npm audit --prefix packages/homey-app
      - run: npm audit --prefix packages/homey-app --omit=dev
      - run: npm audit signatures --omit=optional
        working-directory: packages/homey-app
